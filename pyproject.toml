[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fitmotn"
version = "0.1.0"
description = "FitMoTN training, RL, and evaluation utilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
    "accelerate>=0.26",
    "datasets",
    "numpy",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
vllm = [
    "vllm>=0.19,<0.20",
    "transformers>=4.56,<5",
]

[tool.setuptools]
packages = [
    "fitmotn",
    "fitmotn.baselines",
    "fitmotn.cli",
    "fitmotn.config",
    "fitmotn.data",
    "fitmotn.diagnostics",
    "fitmotn.eval",
    "fitmotn.export",
    "fitmotn.export.remote_code",
    "fitmotn.init",
    "fitmotn.rl",
    "fitmotn.tasks",
    "fitmotn.train",
    "fitmotn.utils",
]

[tool.setuptools.package-dir]
fitmotn = "."
"fitmotn.baselines" = "baselines"
"fitmotn.cli" = "cli"
"fitmotn.config" = "config"
"fitmotn.data" = "data"
"fitmotn.diagnostics" = "diagnostics"
"fitmotn.eval" = "eval"
"fitmotn.export" = "export"
"fitmotn.export.remote_code" = "export/remote_code"
"fitmotn.init" = "init"
"fitmotn.rl" = "rl"
"fitmotn.tasks" = "tasks"
"fitmotn.train" = "train"
"fitmotn.utils" = "utils"
