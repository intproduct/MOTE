<text x="1525" y="283" font-size="21" text-anchor="middle" fill="#17283b" font-weight="normal">0000 → expert 0</text>
<text x="1525" y="326" font-size="21" text-anchor="middle" fill="#17283b" font-weight="normal">0001 → expert 1</text>
<text x="1525" y="369" font-size="21" text-anchor="middle" fill="#17283b" font-weight="normal">0010 → expert 2</text>
<text x="1525" y="411" font-size="21" text-anchor="middle" fill="#17283b" font-weight="normal">⋮</text>
<text x="1525" y="456" font-size="21" text-anchor="middle" fill="#17283b" font-weight="normal">1111 → expert 15</text>
<text x="1525" y="498" font-size="18" text-anchor="middle" fill="#536577" font-weight="normal">p(e) = |amplitude(e)|²</text>
<text x="43" y="592" font-size="23" text-anchor="start" fill="#17283b" font-weight="normal">Each Ry / Rz receives its own token-dependent angle at each layer.</text>
<text x="43" y="630" font-size="22" text-anchor="start" fill="#536577" font-weight="normal">Gij contains two controlled-Ry rotations in opposite directions, with separate trainable angles.</text>
<text x="43" y="675" font-size="24" text-anchor="start" fill="#17283b" font-weight="bold">16 joint probabilities → log probabilities → existing temperature / TopK / capacity / auxiliary loss</text>
